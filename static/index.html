<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechCorp İK Asistanı | Yapay Zeka Güvenlik ve Giskard Laboratuvarı</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <!-- Üst Menü -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-group">
        <div class="brand-logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
            <line x1="8" y1="16" x2="8" y2="16"></line>
            <line x1="16" y1="16" x2="16" y2="16"></line>
          </svg>
        </div>
        <div>
          <div class="brand-title-row">
            <h1 class="brand-title">TechCorp İK Asistanı (Gizem)</h1>
            <span id="health-badge" class="health-badge" role="status" aria-live="polite">
              <span class="health-dot" aria-hidden="true"></span>
              <span id="health-text">Kontrol ediliyor...</span>
            </span>
          </div>
          <p class="brand-subtitle">Prompt Injection, Savunmalı Mimari ve Giskard Denetim Ortamı</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="mode-switch" role="group" aria-label="Çalışma modu seçimi">
          <button type="button" id="btn-mode-vulnerable" class="mode-btn active-vulnerable" aria-pressed="true">
            Zafiyetli Mod
          </button>
          <button type="button" id="btn-mode-secure" class="mode-btn" aria-pressed="false">
            Güvenli Mod
          </button>
        </div>

        <button type="button" id="btn-benchmark" class="btn btn-secondary" aria-label="Öncesi ve sonrası kıyaslama tablosunu aç">
          Kıyaslama Tablosu
        </button>

        <button type="button" id="btn-scan" class="btn btn-primary" aria-label="Gerçek Giskard güvenlik taramasını başlat">
          <span id="scan-text">Giskard Taraması Başlat</span>
        </button>

        <a href="/report" target="_blank" rel="noopener" class="btn btn-secondary" aria-label="Giskard HTML güvenlik raporunu yeni sekmede aç">
          Güvenlik Raporunu Aç
        </a>
      </div>
    </div>
  </header>

  <!-- Canlı Sunum Kısayol Çubuğu -->
  <section class="shortcut-bar" aria-label="Canlı test kısayolları">
    <div class="shortcut-inner">
      <span class="shortcut-label">Hızlı Test Senaryoları:</span>
      <div id="shortcut-buttons" class="shortcut-buttons"></div>
    </div>
  </section>

  <!-- Ana Sohbet Alanı -->
  <main class="chat-wrapper">
    <div id="mode-banner" class="mode-banner vulnerable" role="status" aria-live="polite">
      <span id="mode-banner-text"></span>
      <button type="button" id="btn-reset" class="btn btn-secondary" aria-label="Sohbet geçmişini sıfırla">
        Sohbeti Sıfırla
      </button>
    </div>

    <div class="chat-card">
      <div
        id="chat-messages"
        class="chat-messages"
        role="log"
        aria-live="polite"
        aria-relevant="additions"
        aria-label="Sohbet geçmişi"
      ></div>

      <div id="scan-bar" class="scan-bar hidden" role="status" aria-live="polite">
        <span id="scan-status-text">Tarama durumu bekleniyor...</span>
        <a href="/report" target="_blank" rel="noopener">Raporu Görüntüle</a>
      </div>

      <div class="chat-form-wrap">
        <form id="chat-form" class="chat-form">
          <label for="user-input" class="sr-only">Mesajınız</label>
          <input
            type="text"
            id="user-input"
            class="chat-input"
            maxlength="1000"
            placeholder="Mesajınızı yazın veya yukarıdaki test senaryolarından birini seçin..."
            autocomplete="off"
          >
          <button type="submit" id="btn-send" class="btn btn-primary" aria-label="Mesajı gönder">
            Gönder
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Öncesi / Sonrası Kıyaslama Modalı -->
  <div id="benchmark-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-panel">
      <div class="modal-header">
        <strong id="modal-title">Zafiyetli vs Güvenli Mimari — Kırmızı Takım Kıyaslaması</strong>
        <button type="button" id="btn-close-modal" class="btn btn-secondary" aria-label="Pencereyi kapat">
          Kapat
        </button>
      </div>
      <div id="benchmark-modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="/static/ui_content.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
