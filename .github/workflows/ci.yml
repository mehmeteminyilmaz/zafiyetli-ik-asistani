name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  core-lint-and-test:
    name: Çekirdek Sunucu ve Testler (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requirements.txt ve requirements-dev.txt Python 3.10 - 3.12 destekler
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur (${{ matrix.python-version }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Çekirdek ve geliştirme bağımlılıklarını yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff ile statik kod analizi
        run: ruff check .

      - name: Mock'lu birim ve API testlerini çalıştır
        env:
          GEMINI_API_KEY: ""
        run: pytest -v

  giskard-scanner-compat:
    name: Giskard Tarayıcı Uyumluluğu (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requirements-scan.txt (giskard==2.19.2 -> scipy<1.12.0, numpy<2.0) yalnızca 3.10 ve 3.11 destekler
        python-version: ["3.10", "3.11"]

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur (${{ matrix.python-version }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Giskard tarama bağımlılıklarını yükle ve modülleri doğrula
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scan.txt
          python -c "import giskard_scan, giskard_gemini_client"
