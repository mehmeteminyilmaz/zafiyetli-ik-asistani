name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur (${{ matrix.python-version }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Geliştirme ve test bağımlılıklarını yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff ile statik kod analizi
        run: ruff check .

      - name: Mock'lu birim ve API testlerini çalıştır
        env:
          GEMINI_API_KEY: ""
        run: pytest -v
